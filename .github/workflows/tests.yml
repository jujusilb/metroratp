name: Tests

on:
  push:
  pull_request:

jobs:
  php-tests:
    name: Tests PHP (PHPUnit)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: metroratp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: test
      DATABASE_URL: "mysql://root:@127.0.0.1:3306/metroratp?serverVersion=10.4.32-MariaDB&charset=utf8mb4"

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, mbstring, pdo_mysql, intl
          coverage: none

      - name: Installer les dependances Composer
        run: composer install --prefer-dist --no-progress --no-interaction

      # Les tests fonctionnels (WebTestCase) rendent de vraies pages qui appellent
      # encore_entry_link_tags()/script_tags() dans le layout de base : sans un build
      # Webpack, ces pages plantent faute de public/build/entrypoints.json.
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installer les dependances npm
        run: npm ci

      - name: Builder les assets front (Encore)
        run: npx encore dev

      # config/packages/doctrine.yaml ajoute automatiquement un suffixe "_test" au nom de la
      # base en environnement de test (dbname_suffix), donc la base ciblee est "metroratp_test",
      # pas "metroratp" (creee par le service ci-dessus) : il faut la creer explicitement.
      - name: Creer la base de test
        run: php bin/console doctrine:database:create --env=test --if-not-exists --no-interaction

      # Le schema de base (acces, ligne, station...) n'a jamais ete cree via une migration
      # Doctrine (elles capturent seulement les evolutions de ce projet), donc schema:create
      # est la bonne commande pour partir d'une base vide, comme pour la base de test locale.
      - name: Creer le schema de la base de test
        run: php bin/console doctrine:schema:create --env=test --no-interaction

      - name: Lancer PHPUnit
        run: vendor/bin/phpunit --no-coverage

  js-tests:
    name: Tests JS (Jest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          # @symfony/webpack-encore et @kocal/friendly-errors-webpack-plugin exigent Node
          # >=22.13 (engines) ; Node 20 donnait aussi une version de npm trop ancienne par
          # rapport a celle utilisee en local, ce qui desynchronisait package-lock.json.
          node-version: '22'
          cache: 'npm'

      - name: Installer les dependances npm
        run: npm ci

      - name: Lancer Jest
        run: npm test

  deploy:
    name: Deployer sur Hostinger
    needs: [php-tests, js-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      SSH_HOST: 195.35.49.152
      SSH_PORT: 65002
      SSH_USER: u396779750
      # Dossier prive (hors public_html) contenant l'appli complete : public_html/metroratp
      # est un lien symbolique vers <APP_PATH>/public, cree lors du tout premier deploiement.
      APP_PATH: /home/u396779750/domains/julien-silberstein.fr/metroratp-app
      PUBLIC_LINK: /home/u396779750/domains/julien-silberstein.fr/public_html/metroratp

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installer les dependances npm
        run: npm ci

      # Hostinger (hebergement mutualise) n'a pas Node.js : les assets sont compiles ici,
      # puis livres deja construits (public/build) via rsync.
      - name: Builder les assets front (production)
        run: npm run build

      - name: Preparer la cle SSH de deploiement
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # .env.local (secrets prod : APP_SECRET, DATABASE_URL) vit uniquement sur le serveur,
      # jamais dans Git ni dans ce workflow : on ne le touche pas ici.
      - name: Synchroniser les fichiers vers Hostinger
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='node_modules' \
            --exclude='var' \
            --exclude='tests' \
            --exclude='documentation' \
            --exclude='.env.local' \
            -e "ssh -p $SSH_PORT -i ~/.ssh/deploy_key" \
            ./ "$SSH_USER@$SSH_HOST:$APP_PATH/"

      - name: Installer Composer, migrer la base et publier le lien symbolique
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "
            set -e
            cd '$APP_PATH'
            composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-req=ext-redis
            php bin/console doctrine:migrations:migrate --no-interaction
            php bin/console cache:clear
            if [ ! -L '$PUBLIC_LINK' ]; then
              rm -rf '$PUBLIC_LINK'
              ln -s '$APP_PATH/public' '$PUBLIC_LINK'
            fi
          "
