security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: username

    # ROLE_SUPERADMIN herite de ROLE_ADMIN qui herite de ROLE_USER : un superadmin passe
    # tous les is_granted('ROLE_ADMIN') et ('ROLE_USER'). Seul ROLE_SUPERADMIN peut retirer
    # ROLE_ADMIN a quelqu'un (voir UtilisateurController) ; un simple admin peut seulement
    # promouvoir un utilisateur en admin, jamais le retrograder.
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_SUPERADMIN: ROLE_ADMIN

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true

            logout:
                path: app_logout
                target: app_home

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied.
    # 3 paliers : visiteur anonyme (accueil, connexion, mentions legales) < utilisateur
    # connecte (lecture de tout le site) < administrateur (creation/modification/suppression).
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/logout, roles: PUBLIC_ACCESS }
        - { path: ^/inscription, roles: PUBLIC_ACCESS }
        - { path: ^/verifier/email, roles: PUBLIC_ACCESS }
        - { path: ^/mentions-legales, roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        # API JSON en lecture seule (src/Controller/Api/) : donnees de referentiel transport public
        # (memes donnees qu'IDFM/GTFS, deja publiques par nature), consommee par un client externe
        # (portage Kotlin/Android) qui n'a pas de session navigateur - jamais de mutation possible
        # ici (uniquement GET, verifie dans chaque contoleur Api).
        - { path: ^/api, roles: PUBLIC_ACCESS }
        - { path: ^/mon-profil, roles: ROLE_USER }
        # Suivi de travail sur le projet (Tache/Etape/StatutTache) : pas une donnee du reseau de
        # transport, n'a pas vocation a etre visible par un utilisateur normal (contrairement au
        # reste du site, en lecture libre a partir de ROLE_USER).
        - { path: ^/(tache|etape|statut-tache), roles: ROLE_ADMIN }
        - { path: .*/new$, roles: ROLE_ADMIN }
        - { path: .*/edit$, roles: ROLE_ADMIN }
        - { path: ^/, methods: [POST], roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
