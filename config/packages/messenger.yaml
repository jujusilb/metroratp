framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            # SendEmailMessage volontairement PAS routee vers "async" : aucun worker
            # messenger:consume ne tourne sur ce deploiement (hebergement mutualise Hostinger,
            # pas de process daemon/cron dedie) - un email route "async" resterait indefiniment
            # dans messenger_messages sans jamais partir. Envoi synchrone (comportement par
            # defaut sans routing explicite), acceptable vu le faible volume (email d'inscription
            # uniquement).
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # Route your messages to the transports
            # 'App\Message\YourMessage': async
